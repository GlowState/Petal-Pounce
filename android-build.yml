name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build the signed release AAB using repository secrets
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: JavaScript regression tests
        run: node --test tests/*.test.mjs
      - name: Android lint and debug bundle
        run: gradle -p android-app lintDebug bundleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: petal-pounce-debug-bundle
          path: android-app/app/build/outputs/bundle/debug/*.aab

  signed-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_release }}
    runs-on: ubuntu-latest
    environment: google-play-release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/petal-pounce-upload.jks"
      - name: Build signed release bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/petal-pounce-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android-app lintRelease bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: petal-pounce-release-aab
          path: android-app/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
