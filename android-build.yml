name: Petal Pounce Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      signed_release:
        description: 'Create a signed Google Play AAB (requires release secrets)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify web/Android release assets
        run: node scripts/verify-android-assets.mjs
      - name: Regression tests
        run: node --test tests/*.test.mjs
      - name: Check Android app and build debug APK/AAB
        run: gradle -p android-app lintDebug assembleDebug bundleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: petal-pounce-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: petal-pounce-debug-aab
          path: android-app/app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error

  signed-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_release }}
    runs-on: ubuntu-latest
    environment: google-play-release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify web/Android release assets
        run: node scripts/verify-android-assets.mjs
      - name: Tests
        run: node --test tests/*.test.mjs
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/petal-pounce-upload.jks"
      - name: Build signed Play bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/petal-pounce-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          gradle -p android-app lintRelease bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: petal-pounce-signed-release-aab
          path: android-app/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
