plugins {
    id 'com.android.application'
}

def generatedWebAssets = file("$buildDir/generated/webAssets")
def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def keyAliasValue = System.getenv('ANDROID_KEY_ALIAS')
def keyPasswordValue = System.getenv('ANDROID_KEY_PASSWORD')
def hasReleaseSigning = [keystorePath, keystorePassword, keyAliasValue, keyPasswordValue].every { it }

android {
    namespace 'com.glowstate.petalpounce'
    compileSdk 36

    defaultConfig {
        applicationId 'com.glowstate.petalpounce'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main.assets.srcDir generatedWebAssets
    }
}

// Fail early if the Android wrapper would bundle stale or missing website files.
tasks.register('verifyWebAssets') {
    doLast {
        def dist = rootProject.file('../dist')
        def websiteRoot = rootProject.file('..')
        def required = ['index.html', 'game.mjs', 'engine.mjs', 'scenery.mjs',
            'flowers.mjs', 'hold-controls.mjs', 'profile.mjs', 'rc40.css',
            'joystick.css', 'joystick-classic.png', 'fly-classic.png',
            'petal-arcade.woff2', 'manifest.webmanifest', 'sw.js']
        def missing = required.findAll { !new File(dist, it).isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException('Android web assets missing from dist/: ' + missing.join(', '))
        }
        def paired = ['index.html', 'game.mjs', 'joystick.css', 'rc40.css',
            'sw.js', 'manifest.webmanifest', 'rc39.css', 'rc38.css',
            'neon-ui.css', 'scenery.mjs', 'profile.mjs']
        def stale = paired.findAll { name ->
            def left = new File(websiteRoot, name)
            def right = new File(dist, name)
            !left.isFile() || !right.isFile() || !java.util.Arrays.equals(left.bytes, right.bytes)
        }
        if (!stale.isEmpty()) {
            throw new GradleException('Root/dist mismatch, refusing Android build: ' + stale.join(', '))
        }
        if (!new File(dist, 'index.html').text.contains('game.mjs?v=91')) {
            throw new GradleException('Android app must package current Petal Pounce RC40 files')
        }
    }
}

tasks.register('syncWebAssets', Sync) {
    from rootProject.file('../dist')
    into generatedWebAssets
    exclude '**/.DS_Store'
}

tasks.named('syncWebAssets').configure {
    dependsOn tasks.named('verifyWebAssets')
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('syncWebAssets')
}

dependencies {
    implementation 'androidx.webkit:webkit:1.18.0'
}
